<style>
d-article img { cursor: zoom-in; }
d-article .posts-list img,
d-article a img { cursor: auto; }
.img-zoom-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; cursor: zoom-out; padding: 24px;
}
.img-zoom-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>

<script>
// Event delegation: attach a single listener at document level so it
// works regardless of when distill rewrites the DOM into d-article.
document.addEventListener('click', function (e) {
  var img = e.target;
  if (!img || img.tagName !== 'IMG') return;

  // Listing pages (index, category archives): never zoom.
  if (document.querySelector('.posts-list')) return;

  // Only zoom images inside the article body.
  if (!img.closest('d-article') && !img.closest('.d-article')) return;

  // Skip linked images (preview thumbnails wrapped in <a>).
  if (img.closest('a')) return;

  e.preventDefault();
  var overlay = document.createElement('div');
  overlay.className = 'img-zoom-overlay';
  var big = document.createElement('img');
  big.src = img.currentSrc || img.src;
  overlay.appendChild(big);
  overlay.addEventListener('click', function () { overlay.remove(); });
  document.addEventListener('keydown', function escClose(ev) {
    if (ev.key === 'Escape') {
      overlay.remove();
      document.removeEventListener('keydown', escClose);
    }
  });
  document.body.appendChild(overlay);
});
</script>
